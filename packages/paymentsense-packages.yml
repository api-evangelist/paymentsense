  registry (npm/PyPI/NuGet/Maven/Packagist). Its official first-party developer
  distribution is a set of e-commerce platform integration modules published
  under the Paymentsense-DevSupport and Paymentsense GitHub organizations, plus
  Connect-E sample code. A third-party Omnipay PHP driver also exists but is not
  first-party (official:false).
