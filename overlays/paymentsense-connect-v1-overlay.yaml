overlay: 1.0.0
info:
  title: API Evangelist enhancements for Paymentsense Connect REST API v1
  version: 1.0.0
extends: openapi/paymentsense-connect-v1.json
actions:
  - target: $.info
    update:
      x-apievangelist-provider: paymentsense
      x-apievangelist-product: connect-rest
      x-apievangelist-auth: http-basic
      x-apievangelist-versioning: "media-type (Accept: application/connect.v1+json)"
      x-apievangelist-base-path: /pac + /pat
      x-apievangelist-error-envelope: userMessage
