overlay: 1.0.0
info:
  title: API Evangelist enhancements for Paymentsense Connect-E REST API
  version: 1.0.0
extends: openapi/paymentsense-connect-e-v0.json
actions:
  - target: $.info
    update:
      x-apievangelist-provider: paymentsense
      x-apievangelist-product: connect-e
      x-apievangelist-auth: apiKey to mint access-token, then JWT bearer
      x-apievangelist-token-lifetime: single-use, 30 minutes
      x-apievangelist-proxies: CyberSource
      x-apievangelist-3ds: [3-D Secure, 3-D Secure 2]
      x-apievangelist-client-components: [Connect-E Standard, Connect-E Checkout]
