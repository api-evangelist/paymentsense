apis:
- aid: paymentsense:connect-rest-api
  name: Paymentsense Connect REST API
  description: >-
    Cloud REST API for driving Paymentsense card terminals from EPOS software.
    Covers Pay-At-Counter (/pac) transactions and reports and Pay-At-Table
    (/pat) hospitality flows against a per-merchant Connect host. Published in
    versions v0 (Swagger 2.0, 3.0-beta), v1 (Swagger 2.0, 3.1) and v2 (OpenAPI
    3.0, 3.2, current). Authenticates with HTTP Basic using the merchant API key
    as the password.
  humanURL: https://docs.connect.paymentsense.cloud/rest/api
  baseURL: https://your-host-here.connect.paymentsense.cloud
  tags:
  - Payments
  - Point of Sale
  - Card Payments
  - Pay At Table
  properties:
  - type: Documentation
    url: https://docs.connect.paymentsense.cloud/rest/getting-started
  - type: APIReference
    url: https://docs.connect.paymentsense.cloud/rest/api
  - type: OpenAPI
    url: openapi/paymentsense-connect-v2.json
  - type: OpenAPI
    url: openapi/paymentsense-connect-v1.json
  - type: OpenAPI
    url: openapi/paymentsense-connect-v0.json
  - type: Overlay
    url: overlays/paymentsense-connect-v2-overlay.yaml
  - type: Overlay
    url: overlays/paymentsense-connect-v1-overlay.yaml
  - type: Overlay
    url: overlays/paymentsense-connect-v0-overlay.yaml
  - type: Arazzo
    name: Pay-At-Counter — take a card payment
    url: arazzo/paymentsense-pac-take-payment.yml
- aid: paymentsense:connect-e-rest-api
  name: Paymentsense Connect-E REST API
  description: >-
    OpenAPI 3.0 REST API for online / e-commerce card payments. Issues
    access-tokens, processes and resumes payments, runs cross-reference
    (repeat) payments, and lists supported payment methods against the
    Connect-E host (e.<host>.connect.paymentsense.cloud).
  humanURL: https://docs.connect.paymentsense.cloud/ConnectE/RestApi
  baseURL: https://e.test.connect.paymentsense.cloud
  tags:
  - Payments
  - Online Payments
  - Card Payments
  - E-Commerce
  properties:
  - type: Documentation
    url: https://docs.connect.paymentsense.cloud/ConnectE/RestApi
  - type: APIReference
    url: https://docs.connect.paymentsense.cloud/ConnectE/RestApi
  - type: OpenAPI
    url: openapi/paymentsense-connect-e-v0.json
  - type: Overlay
    url: overlays/paymentsense-connect-e-v0-overlay.yaml
  - type: Components
    url: components/paymentsense-components.yml
- aid: paymentsense:connect-websockets-api
  name: Paymentsense Connect WebSockets API
  description: >-
    Documented WebSockets interface for the Connect platform, offering an
    event-driven alternative to the REST API for terminal integration. No
    downloadable OpenAPI/AsyncAPI specification is published; only reference
    documentation is available.
  humanURL: https://docs.connect.paymentsense.cloud/websockets/api
  baseURL: https://your-host-here.connect.paymentsense.cloud
  tags:
  - Payments
  - WebSockets
  - Point of Sale
  properties:
