aid: paymentsense
url: https://raw.githubusercontent.com/api-evangelist/paymentsense/refs/heads/main/apis.yml
name: Paymentsense
kind: company
description: >-
  Paymentsense is a United Kingdom payment processing company that provides card
  payment acceptance to small and medium-sized businesses through card machines
  (PDQ terminals), online payment gateways, and EPOS integrations. Now part of
  Dojo, its developer-facing surface centers on the Connect platform, a
  cloud-hosted integration layer that gives each merchant an isolated host so
  point-of-sale and hospitality software can drive card terminals without
  touching card data. Paymentsense publishes a genuine public developer portal
  at docs.connect.paymentsense.cloud with interactive Swagger reference docs and
  downloadable OpenAPI/Swagger specifications for the Connect REST API
  (Pay-At-Counter and Pay-At-Table terminal integration, versions v0/v1/v2) and
  the Connect-E REST API for online/e-commerce card payments, plus a documented
  WebSockets interface. Authentication is HTTP Basic using a per-merchant API key
  supplied by Paymentsense. A separate merchant/software-house management portal
  at developers.paymentsense.com sits behind Google sign-in.
